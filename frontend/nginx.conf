server {
    listen 80;
    server_name localhost;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API proxy ----
    # CRITICAL FIX: the SPA calls relative "/api/v1/..." (VITE_API_BASE_URL is
    # baked in at build time). Without this proxy every API request fell into
    # the SPA fallback and returned index.html instead of JSON — the container
    # build could not talk to the backend at all.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow document uploads (backend enforces its own 10 MB limit)
        client_max_body_size 12m;
        proxy_read_timeout 120s;
    }

    # ---- Static SPA ----
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache-busted build assets
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # gzip for text responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

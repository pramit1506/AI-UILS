services:
  - type: web
    name: ai-uils-api
    runtime: docker
    plan: free
    region: singapore
    branch: AI-UILS
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: sh ./start-render.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: "[]"
      - key: CHECKPOINTER_DB_PATH
        value: /tmp/uils-checkpoints.sqlite3
      - key: LLM_PROVIDER
        value: multi
      - key: LITELLM_LOCAL_MODEL_COST_MAP
        value: "True"
